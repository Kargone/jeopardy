<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1, viewport-fit=auto">
    <meta charset="utf-8" />
    <title>Jeopardy</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body id="body">
    <div id="sign-in-container">
        <h1>Jeopardy</h1>
        <button id="sign-in">Sign In</button>
    </div>
    <div id="home-container">
        <h1>Jeopardy</h1>
        <button id="create-game">Create a Game</button>
        <button id="load-game">Load a Game</button>
        <button id="create-board">Create a Board</button>
        <button id="edit-boards">Edit Boards</button>
        <button id="open-settings">Settings</button>
        <button id="log-out">Log Out</button>
    </div>
    <div id="select-board-container">
        <div><h1>Jeopardy</h1></div>
        <div><p id="select-board-path-text">Path: main/</p></div>
        <div id="select-board-folders">
            <div id="select-board-folder-main" class="folder"></div>
        </div>
        <div><button id="select-board-home-button" class="wide-button">Home</button></div>
    </div>
    <div id="create-game-container" class="user-options-input-container">
        <h1>Jeopardy</h1>
        <hr>
        <input id="create-game-name" class="invisible-input" type="checkbox">
        <div>
            <div class="option-title">
                <p>▶</p>
                <label for="create-game-name">Game Name</h2>
            </div>
            <div class="options-container">
                <hr>
                <div class="option">
                    <label for="create-game-name">Name:</label>
                    <input id="create-game-name-input" placeholder="Name here..." type="text"/>
                </div>
            </div>
        </div>
        <hr>
        <input id="create-game-teams" class="invisible-input" type="checkbox">
        <div>
            <div class="option-title">
                <p>▶</p>
                <label for="create-game-teams">Teams (min 2, max 5)</h2>
            </div>
            <div class="options-container">
                <hr>
                <div id="teams-options-container"></div>
                <div>
                    <button id="add-team-button">Add Team</button>
                </div>
            </div>
        </div>
        <hr>
        <input id="create-game-boards" class="invisible-input" type="checkbox">
        <div>
            <div class="option-title">
                <p>▶</p>
                <label for="create-game-boards">Boards</h2>
            </div>
            <div class="options-container">
                <hr>
                <div class="option">
                    <label for="create-game-boards">Normal Jeopardy</label>
                    <label class="switch">
                        <input type="checkbox" id="create-game-normal-jeopardy-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="option">
                    <label for="create-game-boards">Double Jeopardy</label>
                    <label class="switch">
                        <input type="checkbox" id="create-game-double-jeopardy-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="option">
                    <label for="create-game-boards">Final Jeopardy</label>
                    <label class="switch">
                        <input type="checkbox" id="create-game-final-jeopardy-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
        </div>
        <hr>
        <input id="create-game-other" class="invisible-input" type="checkbox">
        <div>
            <div class="option-title">
                <p>▶</p>
                <label for="create-game-other">Other</h2>
            </div>
            <div class="options-container">
                <hr>
                <div class="option">
                    <label for="create-game-other">Team order viewer</label>
                    <label class="switch">
                        <input type="checkbox" id="create-game-team-order-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="option">
                    <label for="create-game-other">Old questions can be clicked on</label>
                    <label class="switch">
                        <input type="checkbox" id="create-game-old-questions-clicked-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
        </div>
        <hr>
        <div id="create-game-button-container" class="create-button-container">
            <button id="create-game-button" class="create-button">Create Game</button>
        </div>
        <div id="create-game-home-button-container" class="home-button-container">
            <button id="create-game-home-button" class="home-button">Home</button>
        </div>
    </div>
    <div id="game-container"></div>
    <div id="load-game-container">
        <div><h1>Jeopardy</h1></div>
        <div id="active-games-container"></div>
        <div><button id="load-game-home-button" class="wide-button">Home</button></div>
    </div>
    <div id="create-board-container" class="user-options-input-container">
        <h1>Jeopardy</h1>
        <hr>
        <input id="board-size" class="invisible-input" type="checkbox">
        <div>
            <div class="option-title">
                <p>▶</p>
                <label for="board-size">Size/Name</h2>
            </div>
            <div class="options-container">
                <hr>
                <div class="option">
                    <label for="board-size">Name:</label>
                    <input id="board-name-input" placeholder="Name here..." type="text"/>
                </div>
                <div class="option">
                    <label for="board-size">Normal jeopardy topic amount:</label>
                    <input id="board-normal-jeopardy-topic-amount-input" class="small-input" value="5" type="number"/>
                </div>
                <div class="option">
                    <label for="board-size">Normal jeopardy questions in each topic:</label>
                    <input id="board-normal-jeopardy-question-amount-input" class="small-input" value="5" type="number"/>
                </div>
                <div class="option">
                    <label for="board-size">Double jeopardy topic amount:</label>
                    <input id="board-double-jeopardy-topic-amount-input" class="small-input" value="5" type="number"/>
                </div>
                <div class="option">
                    <label for="board-size">Double jeopardy questions in each topic:</label>
                    <input id="board-double-jeopardy-question-amount-input" class="small-input" value="5" type="number"/>
                </div>
            </div>
        </div>
        <hr>
        <input id="board-timer" class="invisible-input" type="checkbox">
        <div>
            <div class="option-title">
                <p>▶</p>
                <label for="board-timer">Timer</h2>
            </div>
            <div class="options-container">
                <hr>
                <div class="option">
                    <label for="board-timer">Timer length (normal):</label>
                    <input id="board-timer-length-normal-input" class="large-input" value="30" type="number"/>
                </div>
                <div class="option">
                    <label for="board-timer">Timer length (daily double):</label>
                    <input id="board-timer-length-daily-double-input" class="large-input" value="30" type="number"/>
                </div>
                <div class="option">
                    <label for="board-timer">Timer delay:</label>
                    <input id="board-timer-delay-input" class="small-input" value="5" type="number"/>
                </div>
            </div>
        </div>
        <hr>
        <input id="board-boards" class="invisible-input" type="checkbox">
        <div>
            <div class="option-title">
                <p>▶</p>
                <label for="board-boards">Boards</h2>
            </div>
            <div class="options-container">
                <hr>
                <div class="option">
                    <label for="board-boards">Normal Jeopardy</label>
                    <label class="switch">
                        <input type="checkbox" id="board-normal-jeopardy-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="option">
                    <label for="board-boards">Double Jeopardy</label>
                    <label class="switch">
                        <input type="checkbox" id="board-double-jeopardy-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="option">
                    <label for="board-boards">Final Jeopardy</label>
                    <label class="switch">
                        <input type="checkbox" id="board-final-jeopardy-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
        </div>
        <hr>
        <input id="board-colors" class="invisible-input" type="checkbox">
        <div>
            <div class="option-title">
                <p>▶</p>
                <label for="board-colors">Colors</h2>
            </div>
            <div class="options-container">
                <hr>
                <div class="option">
                    <label for="board-colors">Title:</label>
                    <input id="board-title-color-input" class="large-input" value="#f8ff00" type="text"/>
                </div>
                <div class="option">
                    <label for="board-colors">Topics:</label>
                    <input id="board-topic-color-input" class="large-input" value="#ffffff" type="text"/>
                </div>
                <div class="option">
                    <label for="board-colors">Question on Board:</label>
                    <input id="board-question-board-color-input" class="large-input" value="#f8ff00" type="text"/>
                </div>
                <div class="option">
                    <label for="board-colors">Background:</label>
                    <input id="board-background-color-input" class="large-input" value="#073763" type="text"/>
                </div>
                <div class="option">
                    <label for="board-colors">Answer:</label>
                    <input id="board-answer-color-input" class="large-input" value="#ffffff" type="text"/>
                </div>
                <div class="option">
                    <label for="board-colors">Questions:</label>
                    <input id="board-question-color-input" class="large-input" value="#ffffff" type="text"/>
                </div>
            </div>
        </div>
        <hr>
        <input id="board-question" class="invisible-input" type="checkbox">
        <div>
            <div class="option-title">
                <p>▶</p>
                <label for="board-question">In Question</h2>
            </div>
            <div class="options-container">
                <hr>
                <div class="option">
                    <label for="board-question">Images allowed</label>
                    <label class="switch">
                        <input type="checkbox" id="board-images-allowed-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="option">
                    <label for="board-question">Key pressed to reveal answer/question (control to reset):</label>
                    <button id="board-key-reveal-answer-input">NA</button>
                </div>
                <div class="option">
                    <label for="board-question">Key pressed to go home (control to reset):</label>
                    <button id="board-key-go-home-input">NA</button>
                </div>
            </div>
        </div>
        <hr>
        <input id="board-equations" class="invisible-input" type="checkbox">
        <div>
            <div class="option-title">
                <p>▶</p>
                <label for="board-equations">Equations for Dollar Value</h2>
            </div>
            <div class="options-container">
                <hr>
                <div class="option">
                    <label for="board-equations">Normal Jeopardy:</label>
                    <input id="board-normal-jeopardy-m-input" class="large-input" value="100" type="number"/>
                    <label for="board-equations">x topic number +</label>
                    <input id="board-normal-jeopardy-b-input" class="large-input" value="0" type="number"/>
                </div>
                <div class="option">
                    <label for="board-equations">Double Jeopardy:</label>
                    <input id="board-double-jeopardy-m-input" class="large-input" value="100" type="number"/>
                    <label for="board-equations">x topic number +</label>
                    <input id="board-double-jeopardy-b-input" class="large-input" value="0" type="number"/>
                </div>
            </div>
        </div>
        <hr>
        <div id="finalize-board" class="create-button-container">
            <button class="create-button">Create Board</button>
        </div>
        <div id="create-board-home-button-container" class="home-button-container">
            <button id="create-board-home-button" class="home-button">Home</button>
        </div>
    </div>
    <div id="boards-container"></div>
    <div id="edit-boards-container">
        <div><h1>Jeopardy</h1></div>
        <div><p id="path-text">Path: main/</p></div>
        <div id="folders">
            <div id="folder-main" class="folder"></div>
        </div>
        <div><button id="edit-boards-create-folder-button">Create Folder</button></div>
        <div><button id="edit-boards-home-button">Home</button></div>
    </div>
    <div id="settings-container" class="user-options-input-container">
        <h1>Jeopardy</h1>
        <h2>Default Settings</h2>
        <hr>
        <input id="settings-size" class="invisible-input" type="checkbox">
        <div>
            <div class="option-title">
                <p>▶</p>
                <label for="settings-size">Size/Name</h2>
            </div>
            <div class="options-container">
                <hr>
                <div class="option">
                    <label for="settings-size">Name:</label>
                    <input id="settings-name-input" placeholder="Name here..." type="text"/>
                </div>
                <div class="option">
                    <label for="settings-size">Normal jeopardy topic amount:</label>
                    <input id="settings-normal-jeopardy-topic-amount-input" class="small-input" value="5" type="number"/>
                </div>
                <div class="option">
                    <label for="settings-size">Normal jeopardy questions in each topic:</label>
                    <input id="settings-normal-jeopardy-question-amount-input" class="small-input" value="5" type="number"/>
                </div>
                <div class="option">
                    <label for="settings-size">Double jeopardy topic amount:</label>
                    <input id="settings-double-jeopardy-topic-amount-input" class="small-input" value="5" type="number"/>
                </div>
                <div class="option">
                    <label for="settings-size">Double jeopardy questions in each topic:</label>
                    <input id="settings-double-jeopardy-question-amount-input" class="small-input" value="5" type="number"/>
                </div>
            </div>
        </div>
        <hr>
        <input id="settings-timer" class="invisible-input" type="checkbox">
        <div>
            <div class="option-title">
                <p>▶</p>
                <label for="settings-timer">Timer</h2>
            </div>
            <div class="options-container">
                <hr>
                <div class="option">
                    <label for="settings-timer">Timer length (normal):</label>
                    <input id="settings-timer-length-normal-input" class="large-input" value="30" type="number"/>
                </div>
                <div class="option">
                    <label for="settings-timer">Timer length (daily double):</label>
                    <input id="settings-timer-length-daily-double-input" class="large-input" value="30" type="number"/>
                </div>
                <div class="option">
                    <label for="settings-timer">Timer delay:</label>
                    <input id="settings-timer-delay-input" class="small-input" value="5" type="number"/>
                </div>
            </div>
        </div>
        <hr>
        <input id="settings-boards" class="invisible-input" type="checkbox">
        <div>
            <div class="option-title">
                <p>▶</p>
                <label for="settings-boards">Boards</h2>
            </div>
            <div class="options-container">
                <hr>
                <div class="option">
                    <label for="settings-boards">Normal Jeopardy</label>
                    <label class="switch">
                        <input type="checkbox" id="settings-normal-jeopardy-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="option">
                    <label for="settings-boards">Double Jeopardy</label>
                    <label class="switch">
                        <input type="checkbox" id="settings-double-jeopardy-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="option">
                    <label for="settings-boards">Final Jeopardy</label>
                    <label class="switch">
                        <input type="checkbox" id="settings-final-jeopardy-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
        </div>
        <hr>
        <input id="settings-colors" class="invisible-input" type="checkbox">
        <div>
            <div class="option-title">
                <p>▶</p>
                <label for="settings-colors">Colors</h2>
            </div>
            <div class="options-container">
                <hr>
                <div class="option">
                    <label for="settings-colors">Title:</label>
                    <input id="settings-title-color-input" class="large-input" value="#f8ff00" type="text"/>
                </div>
                <div class="option">
                    <label for="settings-colors">Topics:</label>
                    <input id="settings-topic-color-input" class="large-input" value="#ffffff" type="text"/>
                </div>
                <div class="option">
                    <label for="settings-colors">Question on Board:</label>
                    <input id="settings-question-board-color-input" class="large-input" value="#f8ff00" type="text"/>
                </div>
                <div class="option">
                    <label for="settings-colors">Background:</label>
                    <input id="settings-background-color-input" class="large-input" value="#073763" type="text"/>
                </div>
                <div class="option">
                    <label for="settings-colors">Answer:</label>
                    <input id="settings-answer-color-input" class="large-input" value="#ffffff" type="text"/>
                </div>
                <div class="option">
                    <label for="settings-colors">Questions:</label>
                    <input id="settings-question-color-input" class="large-input" value="#ffffff" type="text"/>
                </div>
            </div>
        </div>
        <hr>
        <input id="settings-question" class="invisible-input" type="checkbox">
        <div>
            <div class="option-title">
                <p>▶</p>
                <label for="settings-question">In Question</h2>
            </div>
            <div class="options-container">
                <hr>
                <div class="option">
                    <label for="settings-question">Images allowed</label>
                    <label class="switch">
                        <input type="checkbox" id="settings-images-allowed-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="option">
                    <label for="settings-question">Key pressed to reveal answer/question (control to reset):</label>
                    <button id="settings-key-reveal-answer-input">NA</button>
                </div>
                <div class="option">
                    <label for="settings-question">Key pressed to go home (control to reset):</label>
                    <button id="settings-key-go-home-input">NA</button>
                </div>
            </div>
        </div>
        <hr>
        <input id="settings-equations" class="invisible-input" type="checkbox">
        <div>
            <div class="option-title">
                <p>▶</p>
                <label for="settings-equations">Equations for Dollar Value</h2>
            </div>
            <div class="options-container">
                <hr>
                <div class="option">
                    <label for="settings-equations">Normal Jeopardy:</label>
                    <input id="settings-normal-jeopardy-m-input" class="large-input" value="100" type="number"/>
                    <label for="settings-equations">x topic number +</label>
                    <input id="settings-normal-jeopardy-b-input" class="large-input" value="0" type="number"/>
                </div>
                <div class="option">
                    <label for="settings-equations">Double Jeopardy:</label>
                    <input id="settings-double-jeopardy-m-input" class="large-input" value="100" type="number"/>
                    <label for="settings-equations">x topic number +</label>
                    <input id="settings-double-jeopardy-b-input" class="large-input" value="0" type="number"/>
                </div>
            </div>
        </div>
        <hr>
        <div id="settings-home-button-container" class="home-button-container">
            <button id="settings-home-button" class="home-button">Home</button>
        </div>
    </div>
    <div id="loading-screen"><div class="loader"></div></div>
    <script src="firebase-sign-in.js" type="module"></script>
    <script src="script.js" type="module"></script>
  </body>
</html>
